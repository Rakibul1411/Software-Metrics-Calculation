# Server configuration
server.port=8080

# File Upload configurations
# max-file-size still caps a single archive; max-request-size is larger because a
# folder upload sends one part per Java file.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB

# Angular development server origins (comma-separated when more than one is needed)
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# Prediction ML Service (FastAPI) Endpoint Configuration
fastapi.ml.service.url=http://localhost:8000/ml/predict
