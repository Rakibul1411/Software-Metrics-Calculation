name: Build and Publish Docker Images

on:
  push:
    branches:
      - master
      - features/promise-metrics-calculation
    paths:
      - 'DefectLab-Updated-Component-Based/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Services with Docker Compose
        working-directory: DefectLab-Updated-Component-Based
        run: |
          echo "Building and pushing updated images to Docker Hub..."
          docker compose build
          docker compose push
