<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DefectLab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1e293b, #0f172a);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }
    .container {
      text-align: center;
      max-width: 440px;
      padding: 30px;
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      margin: 0 auto 20px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 30px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 14px;
      color: #cbd5e1;
      font-weight: 500;
    }
    .error-box {
      display: none;
      margin-top: 20px;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
    }
    .retry-btn {
      display: none;
      margin-top: 16px;
      padding: 8px 20px;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">DL</div>
    <h1>DefectLab</h1>
    <p class="subtitle">Cross-Project Defect Prediction System</p>
    
    <div class="spinner" id="spinner"></div>
    <div class="status-text" id="status">Connecting to DefectLab Core...</div>

    <div class="error-box" id="errorBox">
      Docker is not running. Please launch Docker Desktop or OrbStack, then click Retry.
    </div>
    <button class="retry-btn" id="retryBtn" onclick="window.electronAPI.retry()">Retry</button>
  </div>

  <script>
    // Listen for status events from Electron main process
    if (window.electronAPI) {
      window.electronAPI.onStatus((message) => {
        document.getElementById('status').innerText = message;
      });
      window.electronAPI.onError((err) => {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status').style.display = 'none';
        const box = document.getElementById('errorBox');
        box.style.display = 'block';
        box.innerText = err;
        document.getElementById('retryBtn').style.display = 'inline-block';
      });
    }
  </script>
</body>
</html>
