# Server configuration
server.port=8080

# In local development, reloading compiled classes restarts the Spring context.
# scripts/run-java-dev.sh compiles saved source changes into target/classes.
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=500ms
spring.devtools.restart.quiet-period=250ms

# File Upload configurations
# max-file-size still caps a single archive; max-request-size is larger because a
# folder upload sends one part per Java file.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB

# Angular development server origins (comma-separated when more than one is needed)
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# Internal FastAPI service. Keep the token equal on both services.
ml.service.base-url=${ML_SERVICE_BASE_URL:http://localhost:8000}
ml.service.token=${ML_SERVICE_TOKEN:local-development-token}

# Neon PostgreSQL connection. Environment variables can override these values.
spring.datasource.url=${DEFECTLAB_DB_URL:jdbc:postgresql://ep-twilight-grass-azavtevj-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DEFECTLAB_DB_USER:neondb_owner}
spring.datasource.password=${DEFECTLAB_DB_PASSWORD:npg_xJW86MiOdSRg}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Idempotent schema.sql avoids a migration-history table, so Neon contains only
# the three requested application tables.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.separator=@@

# Neon pools connections and closes idle ones aggressively.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=280000

# Bundled PROMISE/AEEEM files are registered as global predefined datasets.
app.predefined-data-dir=${PREDEFINED_DATA_DIR:../sample-data/predefined}

# Session cookie for the Angular dashboard
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=DEFECTLAB_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${DEFECTLAB_SESSION_SECURE:false}

# Activate the local profile by default. It points at the Docker PostgreSQL
# service unless DEFECTLAB_DB_* variables override it with Neon credentials.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
