<ui-card cardClass="dl-page-card">
  <ui-page-header
    parentLabel="Metric Storage"
    [parentLink]="['/metric-storage']"
    [title]="dataset ? dataset.displayName : ''"
    fallbackTitle="Dataset details"
    (parentClick)="back()">
    <ng-container header-badges *ngIf="dataset as item">
      <ui-badge [tone]="item.hasActualLabel ? 'green' : 'amber'">
        {{ item.hasActualLabel ? 'Labeled' : 'Unlabeled' }}
      </ui-badge>
    </ng-container>
    <ng-container header-actions *ngIf="dataset as item">
      <ui-download-menu label="Download"
          [csvUrl]="facade.downloadUrl(item.id, 'csv')"
          [arffUrl]="facade.downloadUrl(item.id, 'arff')"
          (downloaded)="downloadStarted($event)">
      </ui-download-menu>
      <ui-delete-action *ngIf="!item.systemDataset"
          label="Delete" dialogTitle="Delete dataset"
          [confirmMessage]="'Delete ' + item.displayName + '? This cannot be undone.'"
          successMessage="Dataset deleted successfully."
          [deleteFn]="deleteDataset" (deleted)="onDeleted()">
      </ui-delete-action>
    </ng-container>
  </ui-page-header>

  <ui-state *ngIf="loading" kind="loading" message="Loading dataset details…"></ui-state>

  <ui-state *ngIf="failed" kind="empty" [message]="notFoundMessage"></ui-state>

  <ui-detail-fields *ngIf="dataset" [fields]="detailFields"></ui-detail-fields>

  <div class="dl-detail-section" *ngIf="dataset">
    <div class="dl-view-toggle-bar">
      <h3>Stored values</h3>
      <ui-view-toggle *ngIf="preview && classAnalysisList.length > 0"
                      [mode]="viewMode"
                      (modeChange)="setViewMode($event)">
      </ui-view-toggle>
    </div>

    <ui-state *ngIf="previewLoading" kind="loading" message="Loading preview…"></ui-state>

    <!-- Table View -->
    <div class="dl-table-box" *ngIf="preview && viewMode === 'table'">
      <ui-table [columns]="previewColumns" [rows]="previewRows">
      </ui-table>
      <ui-pagination [total]="totalRows"
                     [page]="page"
                     [pageSize]="pageSize"
                     noun="stored rows"
                     (pageChange)="onPageChange($event)"
                     (pageSizeChange)="onPageSizeChange($event)">
      </ui-pagination>
    </div>

    <!-- Hotspot Treemap View -->
    <div *ngIf="preview && viewMode === 'treemap'">
      <ui-treemap
        [items]="classAnalysisList"
        [title]="dataset.displayName + ' — Architectural Treemap'"
        subtitle="Box size: Lines of Code (LOC) · Color: Defect risk & anti-pattern severity"
      ></ui-treemap>
    </div>
  </div>
</ui-card>
