<ui-card cardClass="dl-page-card">
  <ui-page-header
    parentLabel="Predictions"
    [parentLink]="['/defect-predictions']"
    [title]="run ? ('Run #' + run.id + ' · ' + run.targetDataset.displayName) : ''"
    fallbackTitle="Prediction run"
    (parentClick)="back()">
    <ng-container header-badges *ngIf="run as item">
      <ui-badge [tone]="item.modelConfig.datasetFamily">{{ item.modelConfig.datasetFamily }}</ui-badge>
      <ui-badge tone="blue">{{ item.modelConfig.modelName }} (K={{ item.modelConfig.k }})</ui-badge>
    </ng-container>
    <ng-container header-actions *ngIf="run as item">
      <ui-download-menu *ngIf="item.predictionFileAvailable" variant="ghost" label="Download dataset"
                        [csvUrl]="facade.predictionDownloadUrl(item.id, 'csv')"
                        [arffUrl]="facade.predictionDownloadUrl(item.id, 'arff')"
                        (downloaded)="downloadStarted('Labeled ' + $event)">
      </ui-download-menu>
      <ui-button icon="download" [href]="facade.reportDownloadUrl(item.id)"
                 (click)="downloadStarted('PDF report')">Download report</ui-button>
      <ui-delete-action label="Delete" dialogTitle="Delete prediction run"
          [confirmMessage]="'Delete Run #' + item.id + '? This cannot be undone.'"
          successMessage="Prediction run deleted successfully."
          [deleteFn]="deletePredictionRun" (deleted)="onDeleted()">
      </ui-delete-action>
    </ng-container>
  </ui-page-header>

  <ui-state *ngIf="loading" kind="loading" message="Loading prediction run…"></ui-state>

  <ui-state *ngIf="failed" kind="empty" [message]="notFoundMessage"></ui-state>

  <ui-detail-fields *ngIf="run" [fields]="runFields"></ui-detail-fields>

  <div class="dl-detail-section" *ngIf="run?.evaluation as metrics">
    <h3>Evaluation</h3>
    <div class="dl-grid dl-grid-metrics">
      <ui-metric-card label="Accuracy" [value]="metric(metrics.accuracy)"></ui-metric-card>
      <ui-metric-card label="Precision" [value]="metric(metrics.precision)"></ui-metric-card>
      <ui-metric-card label="Recall" [value]="metric(metrics.recall)"></ui-metric-card>
      <ui-metric-card label="F1-score" [value]="metric(metrics.f1)"></ui-metric-card>
      <ui-metric-card label="ROC-AUC" [value]="metric(metrics.rocAuc)"></ui-metric-card>
    </div>
  </div>

  <div class="dl-detail-section" *ngIf="run">
    <h3>Predicted classes</h3>
    <div class="dl-table-box" *ngIf="run.predictions.length; else emptyPredictions">
      <ui-table [columns]="predictionDetailColumns" [rows]="pagedPredictions"
                trackByKey="classIdentifier">
        <ng-template uiTableCell="defectProbability" let-row>{{ row.defectProbability | number:'1.4-4' }}</ng-template>
        <ng-template uiTableCell="predictedLabel" let-row>{{ row.predictedLabel === 1 ? 'Buggy' : 'Clean' }}</ng-template>
        <ng-template uiTableCell="actualLabel" let-row>{{ row.actualLabel === 1 ? 'Buggy' : 'Clean' }}</ng-template>
      </ui-table>
      <ui-pagination [total]="run.predictions.length" [page]="page" [pageSize]="pageSize" noun="predictions"
                     (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
      </ui-pagination>
    </div>
    <ng-template #emptyPredictions><ui-state kind="empty" message="No predictions available."></ui-state></ng-template>
  </div>
</ui-card>
