<ui-card cardClass="dl-page-card">
  <div class="dl-detail-header">
    <h2>{{ mode === 'archive' ? 'Analyze java archive' : 'Analyze GitHub repository' }}</h2>
  </div>

  <section class="dl-grid dl-grid-3">
    <ui-metric-card variant="stat" label="01" value="Source code archive" [clickable]="true" [compact]="true"
                    [selected]="mode === 'archive'" [disabled]="family === 'AEEEM'"
                    (pressed)="selectMode('archive')">
    </ui-metric-card>
    <ui-metric-card variant="stat" label="02" value="GitHub repository" [clickable]="true" [compact]="true"
                    [selected]="mode === 'github'" (pressed)="selectMode('github')">
    </ui-metric-card>
    <ui-metric-card variant="stat" label="03" value="Auto-saved to Metric Storage" [compact]="true">
    </ui-metric-card>
  </section>

  <div class="dl-detail-section dl-form-fill">
    <form class="dl-form-stack dl-form-fill" (ngSubmit)="submit()">
      <div class="dl-form-row dl-form-row-3">
        <ui-radio-group label="Metric family" [options]="familyOptions"
                         [value]="family" (valueChange)="onFamilyChange($event)">
        </ui-radio-group>
        <ui-radio-group label="Source input" [options]="modeOptions"
                         [value]="mode" (valueChange)="onModeChange($event)">
        </ui-radio-group>
        <ui-input label="Project version" [required]="true"
                   placeholder="Example: 1.7 or 3.4"
                   [value]="projectVersion" (valueChange)="projectVersion = $event">
        </ui-input>
        <ui-input label="Project name"
                   placeholder="Automatically derived when empty"
                   [value]="projectName" (valueChange)="projectName = $event">
        </ui-input>
        <ui-input *ngIf="mode === 'github'" label="Public GitHub URL" [required]="true"
                   placeholder="https://github.com/owner/repository"
                   [value]="githubUrl" (valueChange)="githubUrl = $event">
        </ui-input>
        <ui-select *ngIf="mode === 'github' && family === 'AEEEM'"
                   label="AEEEM Benchmark preset" [options]="aeeemProfileOptions"
                   [value]="aeeemProfile" (valueChange)="onAeeemProfileChange($event)">
        </ui-select>
      </div>

      <ng-container *ngIf="mode === 'archive'">
        <ui-file-picker
          fieldLabel="Source archive"
          [required]="true"
          accept=".zip,.tar,.tgz,.tar.gz,.gz,application/zip,application/x-tar,application/gzip"
          [label]="archive?.name || 'Drop your Java source archive here'"
          [helper]="'Accepts: ZIP, TAR, TGZ, TAR.GZ or GZ\nMaximum 500 MB'"
          (fileChange)="selectArchive($event)">
        </ui-file-picker>
      </ng-container>

      <ui-state *ngIf="error" kind="error" [message]="error"></ui-state>
      <div class="dl-form-actions">
        <ui-button type="button" variant="ghost" icon="undo" [disabled]="busy" (pressed)="cancel()">Cancel</ui-button>
        <ui-button type="submit" [disabled]="busy || !canSubmit()" [loading]="busy">
          {{ busy ? 'Extracting metrics…' : 'Extract metrics' }}
        </ui-button>
      </div>
    </form>
  </div>
</ui-card>
