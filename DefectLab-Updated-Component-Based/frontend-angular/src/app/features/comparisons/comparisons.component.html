<ui-card cardClass="dl-page-card">
  <ui-page-header title="Metric Comparisons">
    <ui-search-toggle header-search label="Search comparisons" placeholder="Project name"
        [query]="search" (queryChange)="search = $event">
    </ui-search-toggle>
    <ui-button header-actions icon="plus" link="/metric-comparisons/new">New Comparison</ui-button>
  </ui-page-header>

  <div class="dl-form-row dl-form-row-3">
    <ui-select label="Metric family" [options]="familyFilterOptions"
               [value]="familyFilter" (valueChange)="onFamilyFilterChange($event)">
    </ui-select>
  </div>

  <div class="dl-detail-section dl-fill">
    <ui-state *ngIf="loading" kind="loading" message="Loading comparisons…"></ui-state>
    <div class="dl-table-box" *ngIf="!loading && filtered.length; else empty">
      <ui-table [columns]="columns" [rows]="pageRows" trackByKey="key">
        <ng-template uiTableCell="pair" let-row>
          <strong>{{ row.displayName }}</strong>
        </ng-template>
        <ng-template uiTableCell="family" let-row>
          <ui-badge [tone]="row.datasetFamily">{{ row.datasetFamily }}</ui-badge>
        </ng-template>
        <ng-template uiTableCell="actions" let-row>
          <ui-button variant="ghost" size="sm" icon="view"
                     [link]="['/metric-comparisons', row.comparisonId]"
                     (pressed)="view(row)"
                     title="View comparison" ariaLabel="View comparison"></ui-button>
        </ng-template>
      </ui-table>
      <ui-pagination [total]="filtered.length" [page]="page" [pageSize]="pageSize" noun="comparisons"
                     (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
      </ui-pagination>
    </div>
    <ng-template #empty>
      <ui-empty-state *ngIf="!loading"
        icon="chart"
        [title]="pairs.length ? 'No matching comparisons found' : 'No Metric Comparisons Yet'"
        [description]="pairs.length
           ? 'Try searching with another project name or clearing the family filter.'
           : 'Compare manual metrics against predefined PROMISE or AEEEM baselines to verify calculation consistency.'">
        <ui-button icon="plus" link="/metric-comparisons/new">Start New Comparison</ui-button>
        <ui-button variant="ghost" icon="chart" link="/metric-storage">View Metric Storage</ui-button>
      </ui-empty-state>
    </ng-template>
  </div>
</ui-card>
