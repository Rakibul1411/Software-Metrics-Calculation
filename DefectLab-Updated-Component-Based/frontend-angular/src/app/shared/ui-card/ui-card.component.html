<section class="dl-card" [ngClass]="cardClass">
  <div class="dl-card-head" *ngIf="heading">
    <div>
      <h2>{{ heading }}</h2>
      <p *ngIf="subtitle">{{ subtitle }}</p>
    </div>
    <div class="dl-actions"><ng-content select="[actions]"></ng-content></div>
  </div>
  <ng-content></ng-content>
</section>
