<div class="dl-toast-stack" *ngIf="toasts.length" aria-live="polite">
  <div *ngFor="let toast of toasts" class="dl-toast" [ngClass]="'dl-toast-' + toast.kind" role="status">
    <div class="dl-toast-icon-wrap">
      <ui-icon class="dl-toast-icon" [name]="icon(toast.kind)" [size]="14"></ui-icon>
    </div>
    <span class="dl-toast-message">{{ toast.message }}</span>
    <button type="button" class="dl-toast-close" aria-label="Dismiss" (click)="dismiss(toast.id)">
      <ui-icon name="close" [size]="12"></ui-icon>
    </button>
  </div>
</div>
